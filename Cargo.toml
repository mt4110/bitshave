[package]
name = "bitshave"
version = "0.1.1"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.4"
anyhow = "1.0"
thiserror = "1.0"
tempfile = "3.8"
blake3 = "=1.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
indicatif = "0.17"
console = "0.15"
file-format = "0.25"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
